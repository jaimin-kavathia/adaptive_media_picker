name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          architecture: x64

      # Cache pub dependencies
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      # Install dependencies (root + example)
      - name: Install dependencies
        run: |
          flutter pub get
          if [ -d "example" ]; then
            (cd example && flutter pub get)
          fi

      # Fail on unformatted code (pub.dev deducts points for it)
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - name: Analyze root
        run: flutter analyze

      - name: Analyze example
        if: ${{ hashFiles('example/pubspec.yaml') != '' }}
        run: (cd example && flutter analyze)

      # Run tests root
      - name: Run tests (root)
        run: flutter test --no-pub

      # Run tests example (if exists)
      - name: Run tests (example)
        if: ${{ hashFiles('example/pubspec.yaml') != '' }}
        run: (cd example && flutter test --no-pub)

  # Same scoring tool pub.dev uses; fails if any pub points would be lost.
  pana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Run pana
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0 .
