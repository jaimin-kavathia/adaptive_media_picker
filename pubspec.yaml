name: adaptive_media_picker
description: "Image & video picker with permissions, camera/gallery source sheet, cropping (incl. circle) on every platform, size/type validation, and no READ_MEDIA permission."
version: 2.0.0
repository: https://github.com/jaimin-kavathia/adaptive_media_picker
issue_tracker: https://github.com/jaimin-kavathia/adaptive_media_picker/issues
documentation: https://pub.dev/documentation/adaptive_media_picker/latest/
license: MIT
topics:
  - image-picker
  - video-picker
  - camera
  - gallery
  - file-selection

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.10.0
  image_cropper: ">=12.2.1 <14.0.0"
  crop_your_image: ^2.0.1
  smart_permission: ^1.0.1
  photo_manager: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

platforms:
  android:
  ios:
  web:
  macos:
  linux:
  windows:
